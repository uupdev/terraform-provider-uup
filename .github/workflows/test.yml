# Builds the provider, checks the generated docs are current, and runs the
# tests against an in-memory fake of the You Up? API. The tests download
# Terraform themselves.
name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - name: The docs match the schema
        run: |
          go generate ./...
          git diff --exit-code -- docs/
      - run: go test ./... -v -count=1
